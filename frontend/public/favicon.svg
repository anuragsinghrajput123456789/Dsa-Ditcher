<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Definitions for gradients and drop shadows -->
  <defs>
    <linearGradient id="shield-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="spark-grad" x1="44" y1="8" x2="56" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing outer halo -->
  <path d="M32 4 L56 16 L56 44 L32 58 L8 44 L8 16 Z" fill="url(#shield-grad)" opacity="0.15" filter="url(#glow)"/>

  <!-- Main Hexagonal Shield -->
  <path d="M32 6 L53 17 L53 42 L32 55 L11 42 L11 17 Z" fill="#0F0F19" stroke="url(#shield-grad)" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Code Brackets "{}" in Neon Glow -->
  <g transform="translate(1, 1)">
    <!-- Left curly bracket "{" -->
    <path d="M25 20 H20 C18 20 18 23 18 25 V28 C18 30 16 32 14 32 C16 32 18 34 18 36 V39 C18 41 18 44 20 44 H25" 
          stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    
    <!-- Right curly bracket "}" -->
    <path d="M38 20 H43 C45 20 45 23 45 25 V28 C45 30 47 32 49 32 C47 32 45 34 45 36 V39 C45 41 45 44 43 44 H38" 
          stroke="#EC4899" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  </g>

  <!-- Central Connection Node (DSA Graph Representation) -->
  <circle cx="32" cy="33" r="3.5" fill="#8B5CF6" filter="url(#glow)"/>
  <line x1="22" y1="33" x2="28.5" y2="33" stroke="#3B82F6" stroke-width="1.5" opacity="0.6"/>
  <line x1="35.5" y1="33" x2="42" y2="33" stroke="#EC4899" stroke-width="1.5" opacity="0.6"/>

  <!-- Sparkling Node on the Top-Right (AlgoSpark Core) -->
  <g filter="url(#glow)">
    <circle cx="50" cy="14" r="5" fill="url(#spark-grad)"/>
    <!-- Sparkles beams -->
    <path d="M50 7 V21 M43 14 H57" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
